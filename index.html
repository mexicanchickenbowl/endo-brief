<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endo Morning Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3352;
      --text:     #e8eaf6;
      --muted:    #8891b4;
      --gold:     #f0c040;
      --teal:     #38bdf8;
      --red:      #f87171;
      --green:    #34d399;
      --purple:   #a78bfa;
      --player-h: 86px;
    }

    html { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); scroll-behavior: smooth; }
    body { min-height: 100vh; }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    .header-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 8px;
      background: linear-gradient(135deg, var(--gold) 0%, #e08020 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-sub  { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }

    /* Search + filters */
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .search-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); pointer-events: none; }
    input[type="search"] {
      width: 100%; padding: 8px 10px 8px 32px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color .15s;
    }
    input[type="search"]:focus { border-color: var(--gold); }
    input[type="search"]::placeholder { color: var(--muted); }

    .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all .15s; white-space: nowrap; font-family: inherit;
    }
    .filter-btn:hover { border-color: var(--gold); color: var(--text); }
    .filter-btn.active { background: var(--gold); border-color: var(--gold); color: #0f1117; }

    /* ── Two-column layout (list + video panel) ── */
    .layout {
      max-width: 1280px; margin: 0 auto;
      display: flex; gap: 24px;
      padding: 16px 16px calc(var(--player-h) + 24px);
      align-items: flex-start;
    }
    main { flex: 1; min-width: 0; max-width: 780px; }
    .ep-count { font-size: 12px; color: var(--muted); margin-bottom: 10px; padding: 0 2px; }

    /* ── Video panel ── */
    aside.video-panel {
      width: 460px; flex-shrink: 0;
      position: sticky; top: 140px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .video-wrap {
      position: relative; width: 100%;
      aspect-ratio: 16 / 9; background: #000;
    }

    .video-wrap { position: relative; }
    .fs-btn {
      position: absolute; top: 8px; right: 8px;
      background: rgba(15,23,42,0.72); border: 1px solid rgba(212,175,55,0.35);
      border-radius: 6px; padding: 5px 8px; cursor: pointer;
      font-size: 18px; line-height: 1; color: #d4af37;
      opacity: 0; transition: opacity 0.2s;
      z-index: 10;
    }
    .video-wrap:hover .fs-btn { opacity: 1; }
    .video-wrap:fullscreen .fs-btn,
    .video-wrap:-webkit-full-screen .fs-btn { opacity: 1; }
    .video-wrap video {
      width: 100%; height: 100%; display: block; background: #000;
    }
    .video-meta {
      padding: 12px 14px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .video-meta .vm-title {
      font-size: 13px; color: var(--text); font-weight: 600;
      flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .vm-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      text-transform: uppercase; letter-spacing: 0.4px;
      background: rgba(240,192,64,0.15); color: var(--gold);
      border: 1px solid rgba(240,192,64,0.3); white-space: nowrap;
    }
    .vm-badge.no-video {
      background: rgba(136,145,180,0.12); color: var(--muted); border-color: var(--border);
    }
    /* Fallback static info card */
    .video-fallback {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1a2238 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; gap: 16px; text-align: center;
    }
    .video-fallback .wave-icon {
      width: 64px; height: 64px; color: var(--gold); opacity: 0.85;
    }
    .video-fallback .fb-title {
      font-size: 16px; font-weight: 700; color: #f5f5f5;
      line-height: 1.3; max-width: 90%;
    }
    .video-fallback .fb-sub {
      font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px;
    }

    /* Mobile collapse */
    .video-toggle {
      display: none;
      width: 100%; padding: 10px 14px;
      background: var(--surface2); border: none; border-bottom: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: left;
      display: flex; align-items: center; justify-content: space-between;
    }
    .video-toggle .chev { transition: transform .2s; font-size: 16px; color: var(--muted); }
    aside.video-panel.collapsed .video-toggle .chev { transform: rotate(-90deg); }
    aside.video-panel.collapsed .video-body { display: none; }

    @media (min-width: 900px) {
      .video-toggle { display: none !important; }
    }
    @media (max-width: 899px) {
      .layout { flex-direction: column; gap: 16px; }
      aside.video-panel {
        width: 100%; position: relative; top: 0;
      }
      .video-toggle { display: flex; }
      /* Auto-collapsed by default on mobile via JS */
    }

    .episode-list { display: flex; flex-direction: column; gap: 6px; }

    .episode-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s;
      display: flex; align-items: center; gap: 14px;
    }
    .episode-card:hover { background: var(--surface2); border-color: #3e4670; }
    .episode-card.active {
      border-color: var(--gold);
      background: rgba(240,192,64,0.06);
    }
    .episode-card.unavailable { opacity: 0.45; cursor: not-allowed; }

    .play-btn {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .episode-card.active .play-btn { background: var(--gold); border-color: var(--gold); }
    .play-btn svg { width: 14px; height: 14px; fill: var(--muted); }
    .episode-card.active .play-btn svg { fill: #0f1117; }
    .episode-card:hover:not(.active) .play-btn svg { fill: var(--text); }

    .ep-body { flex: 1; min-width: 0; }
    .ep-top { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .ep-title { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .episode-card.active .ep-title { color: var(--gold); }

    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
      white-space: nowrap; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .tag-abe    { background: rgba(167,139,250,0.15); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }
    .tag-lit    { background: rgba(56,189,248,0.12); color: var(--teal);   border: 1px solid rgba(56,189,248,0.25); }
    .tag-brief  { background: rgba(52,211,153,0.12); color: var(--green);  border: 1px solid rgba(52,211,153,0.25); }
    .tag-na     { background: rgba(248,113,113,0.12); color: var(--red);   border: 1px solid rgba(248,113,113,0.25); }

    .ep-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ep-date { font-size: 11px; color: var(--muted); }
    .ep-size {
      font-size: 11px; color: var(--muted);
      background: var(--surface2); border: 1px solid var(--border);
      padding: 1px 7px; border-radius: 6px;
    }
    .ep-dur { font-size: 11px; color: var(--muted); }

    .ep-nowplaying {
      font-size: 10px; color: var(--gold); font-weight: 600;
      display: flex; align-items: center; gap: 4px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .pulse {
      width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty svg { width: 48px; height: 48px; stroke: var(--muted); opacity: .4; margin-bottom: 14px; }
    .empty p { font-size: 15px; }

    /* ── Player bar ── */
    #player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: rgba(26,29,39,0.97);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      height: var(--player-h);
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 16px;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    #player-bar.visible { transform: translateY(0); }

    .player-inner { max-width: 780px; margin: 0 auto; width: 100%; }
    .player-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .player-title { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ctrl-btn {
      background: none; border: none; cursor: pointer; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 4px; border-radius: 6px; transition: color .15s;
    }
    .ctrl-btn:hover { color: var(--gold); }
    .ctrl-btn svg { width: 20px; height: 20px; }

    #play-pause-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--gold); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .15s;
    }
    #play-pause-btn:hover { transform: scale(1.07); }
    #play-pause-btn svg { width: 16px; height: 16px; fill: #0f1117; }

    .speed-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; font-weight: 600;
      padding: 4px 8px; border-radius: 6px; cursor: pointer; font-family: inherit;
      transition: border-color .15s; white-space: nowrap;
    }
    .speed-btn:hover { border-color: var(--gold); color: var(--gold); }

    .player-progress { display: flex; align-items: center; gap: 10px; }
    .time-label { font-size: 11px; color: var(--muted); width: 38px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .time-label.right { text-align: right; }

    input[type="range"] {
      flex: 1; height: 4px; appearance: none; background: var(--border);
      border-radius: 4px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: var(--gold); cursor: pointer; transition: transform .1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }
    input[type="range"].seek-bar { background: linear-gradient(to right, var(--gold) 0%, var(--border) 0%); }

    audio { display: none; }

    /* Loading overlay */
    #loading {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      z-index: 999;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 14px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3e4670; }

    @media (max-width: 520px) {
      .brand-name { font-size: 15px; }
      .episode-card { padding: 12px; gap: 10px; }
      .play-btn { width: 32px; height: 32px; }
      .ep-title { font-size: 13px; }
      .player-title { font-size: 12px; }
      .time-label { width: 30px; font-size: 10px; }
      :root { --player-h: 80px; }
    }

    /* ── Listen tracking ── */
    .episode-card.listened {
      opacity: 0.65;
      border-left: 3px solid var(--green);
    }
    .listen-badge {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #0f1117; font-weight: 700;
      flex-shrink: 0; transition: background .15s, transform .1s;
      margin-left: 8px;
    }
    .listen-badge:hover { background: #2dbd8a; transform: scale(1.1); }
    .listen-badge.unlistened {
      background: transparent; border: 1.5px solid var(--border);
      color: var(--muted); font-size: 10px;
    }
    .listen-badge.unlistened:hover { border-color: var(--green); color: var(--green); }

    /* Progress bar row */
    .progress-bar-row {
      display: flex; align-items: center; gap: 10px; margin-top: 4px;
      font-size: 12px; color: var(--muted);
    }
    .progress-track {
      flex: 1; height: 6px; background: var(--border);
      border-radius: 3px; overflow: hidden; min-width: 60px;
    }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 3px; transition: width .3s; }
    .progress-pct { white-space: nowrap; font-size: 12px; color: var(--muted); min-width: 32px; text-align: right; }
    .reset-link {
      margin-left: 4px; font-size: 11px; color: var(--muted);
      background: none; border: none; cursor: pointer; font-family: inherit;
      padding: 2px 4px; border-radius: 4px; text-decoration: underline;
      transition: color .15s; flex-shrink: 0;
    }
    .reset-link:hover { color: var(--red); }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Fetching episodes…</div>
</div>

<!-- Header -->
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">🦷</div>
      <div>
        <div class="brand-name">Endo Morning Brief</div>
        <div class="brand-sub">Endodontic Board Prep &amp; Literature</div>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search-input" placeholder="Search episodes…" autocomplete="off" />
      </div>
      <div class="filter-btns">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="abe">ABE Review</button>
        <button class="filter-btn" data-filter="lit">Lit Spotlight</button>
        <button class="filter-btn" data-filter="brief">Morning Brief</button>
        <button class="filter-btn" data-filter="listened">✓ Listened</button>
        <button class="filter-btn" data-filter="unlistened">○ Unlistened</button>
      </div>
    </div>
  </div>
    <div class="progress-bar-row">
      <span id="progress-label">Progress: 0 / 0 listened</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span class="progress-pct" id="progress-pct">0%</span>
      <button class="reset-link" id="reset-btn">Reset all</button>
    </div>
</header>

<!-- Two-column layout: episode list + video panel -->
<div class="layout">
  <main>
    <div class="ep-count" id="ep-count"></div>
    <div class="episode-list" id="episode-list"></div>
    <div class="empty" id="empty-state" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
      </svg>
      <p>No episodes match your search.</p>
    </div>
  </main>

  <aside class="video-panel" id="video-panel">
    <button class="video-toggle" id="video-toggle" type="button" aria-expanded="true">
      <span>Episode Video</span>
      <span class="chev">▾</span>
    </button>
    <div class="video-body">
      <div class="video-wrap">
        <button class="fs-btn" id="fs-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
        <video id="video-el" playsinline preload="metadata" style="display:none"></video>
        <div class="video-fallback" id="video-fallback">
          <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3"  y1="12" x2="3"  y2="12"/>
            <line x1="7"  y1="9"  x2="7"  y2="15"/>
            <line x1="11" y1="6"  x2="11" y2="18"/>
            <line x1="15" y1="9"  x2="15" y2="15"/>
            <line x1="19" y1="11" x2="19" y2="13"/>
            <circle cx="11" cy="12" r="10" stroke-dasharray="3 3" opacity="0.25"/>
          </svg>
          <div class="fb-title" id="fb-title">Select an episode to begin</div>
          <div class="fb-sub" id="fb-sub">Endo Morning Brief</div>
        </div>
      </div>
      <div class="video-meta">
        <span class="vm-title" id="vm-title">No episode selected</span>
        <span class="vm-badge no-video" id="vm-badge">Idle</span>
      </div>
    </div>
  </aside>
</div>

<!-- Sticky player -->
<div id="player-bar">
  <div class="player-inner">
    <div class="player-top">
      <div class="player-title" id="player-title">—</div>
      <div class="player-controls">
        <button class="ctrl-btn" id="skip-back-btn" title="Skip back 15s">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
            <text x="8" y="16" font-size="5.5" fill="currentColor" stroke="none" font-family="Inter,sans-serif" font-weight="700">15</text>
          </svg>
        </button>
        <button id="play-pause-btn" title="Play / Pause">
          <svg id="icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="ctrl-btn" id="skip-fwd-btn" title="Skip forward 30s">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-3.51"/>
            <text x="8" y="16" font-size="5.5" fill="currentColor" stroke="none" font-family="Inter,sans-serif" font-weight="700">30</text>
          </svg>
        </button>
        <button class="speed-btn" id="speed-btn" title="Playback speed">1×</button>
      </div>
    </div>
    <div class="player-progress">
      <span class="time-label" id="time-current">0:00</span>
      <input type="range" class="seek-bar" id="seek-bar" value="0" min="0" max="100" step="0.1" />
      <span class="time-label right" id="time-total">0:00</span>
    </div>
  </div>
</div>

<audio id="audio-el" preload="metadata"></audio>

<script>
(() => {
  /* ─── Config ─── */
  const RSS_URL = 'https://raw.githubusercontent.com/mexicanchickenbowl/endo-brief/main/feed.rss';
  const SPEEDS  = [0.75, 1, 1.25, 1.5, 2];
  // Videos are committed under /videos and served by GitHub Pages, which sets
  // Content-Type: video/mp4 with byte-range support. raw.githubusercontent.com
  // serves mp4 as application/octet-stream with nosniff (browsers refuse), and
  // release-asset URLs redirect to a short-lived signed CDN URL with
  // Content-Disposition: attachment, which also breaks <video> playback.
  // The dashboard runs on the same Pages origin, so this is also same-origin.
  // Relative path keeps it portable across the Pages domain and any local serve.
  const VIDEO_BASE = 'videos/';
  // Episodes that have a generated article-card video.
  const VIDEO_GUIDS = new Set([
    'lit-brief-2026-05-17',
    'recent-lit-2026-05-17',
    'abe-review-2026-05-16-tooth-resorption',
    'abe-review-2026-05-15-vital-pulp-therapy',
    'lit-brief-2026-05-15',
    'abe-review-2026-05-15',
  ]);
  const videoUrlFor = guid => VIDEO_GUIDS.has(guid) ? `${VIDEO_BASE}episode_${guid}.mp4` : null;

  /* ─── State ─── */
  let episodes = [];
  let activeIdx = null;
  let speedIdx  = 1;  // default 1×
  let isSeeking = false;

  /* ── Listen tracking ── */
  const listened   = new Set(JSON.parse(localStorage.getItem('endo_listened') || '[]'));
  const partial    = JSON.parse(localStorage.getItem('endo_partial') || '{}');
  let listenTimer  = null;
  let activeGuid   = null;
  let partialSecs  = 0;

  function saveListened() {
    localStorage.setItem('endo_listened', JSON.stringify([...listened]));
  }
  function savePartial() {
    localStorage.setItem('endo_partial', JSON.stringify(partial));
  }
  function markListened(guid) {
    if (!guid) return;
    listened.add(guid);
    saveListened();
    renderProgress();
    renderList(episodes);
  }
  function unmarkListened(guid) {
    if (!guid) return;
    listened.delete(guid);
    delete partial[guid];
    saveListened();
    savePartial();
    renderProgress();
    renderList(episodes);
  }
  function renderProgress() {
    const total = episodes.length;
    const count = episodes.filter(ep => ep.guid && listened.has(ep.guid)).length;
    const pct   = total ? Math.round((count / total) * 100) : 0;
    const lbl = document.getElementById('progress-label');
    const fill = document.getElementById('progress-fill');
    const pctEl = document.getElementById('progress-pct');
    if (lbl)   lbl.textContent   = `Progress: ${count} / ${total} listened`;
    if (fill)  fill.style.width  = pct + '%';
    if (pctEl) pctEl.textContent = pct + '%';
  }

  /* ─── DOM refs ─── */
  const $list    = document.getElementById('episode-list');
  const $count   = document.getElementById('ep-count');
  const $empty   = document.getElementById('empty-state');
  const $search  = document.getElementById('search-input');
  const $bar     = document.getElementById('player-bar');
  const $title   = document.getElementById('player-title');
  const $ppBtn   = document.getElementById('play-pause-btn');
  const $iconP   = document.getElementById('icon-play');
  const $iconPause = document.getElementById('icon-pause');
  const $seekBar = document.getElementById('seek-bar');
  const $timeCur = document.getElementById('time-current');
  const $timeTot = document.getElementById('time-total');
  const $speedBtn= document.getElementById('speed-btn');
  const $skBack  = document.getElementById('skip-back-btn');
  const $skFwd   = document.getElementById('skip-fwd-btn');
  const $loading = document.getElementById('loading');
  const audio    = document.getElementById('audio-el');
  const video    = document.getElementById('video-el');
  const $vFallback = document.getElementById('video-fallback');
  const $fbTitle = document.getElementById('fb-title');
  const $fbSub   = document.getElementById('fb-sub');
  const $vmTitle = document.getElementById('vm-title');
  const $vmBadge = document.getElementById('vm-badge');
  const $vPanel  = document.getElementById('video-panel');
  const $vToggle = document.getElementById('video-toggle');

  /* ─── A/V sync ─── */
  // Guard against feedback loops when we mirror one media element's state to the other.
  let syncing = false;
  const SEEK_EPSILON = 0.35; // seconds — don't ping-pong on tiny drift

  function showVideo(url) {
    if (url) {
      $vFallback.style.display = 'none';
      video.style.display = '';
      video.muted = true; // audio comes from <audio>, not <video>
      // Use a <source> child with explicit type hint so the browser doesn't have
      // to sniff MIME — important when serving from raw.githubusercontent.com.
      video.innerHTML = '';
      const src = document.createElement('source');
      src.src = url;
      src.type = 'video/mp4';
      video.appendChild(src);
      video.load();
    } else {
      video.pause();
      video.innerHTML = '';
      video.removeAttribute('src');
      video.load();
      video.style.display = 'none';
      $vFallback.style.display = '';
    }
  }

  // Surface load errors in the UI rather than failing silently.
  video.addEventListener('error', () => {
    const err = video.error;
    console.warn('video element error', err && err.code, err && err.message, video.currentSrc);
    $vmBadge.textContent = 'Video error';
    $vmBadge.classList.add('no-video');
    video.style.display = 'none';
    $vFallback.style.display = '';
  });

  function setVideoMeta(ep, hasVideo) {
    $vmTitle.textContent = ep ? ep.title : 'No episode selected';
    if (!ep) {
      $vmBadge.textContent = 'Idle';
      $vmBadge.classList.add('no-video');
      $fbTitle.textContent = 'Select an episode to begin';
      $fbSub.textContent = 'Endo Morning Brief';
    } else if (hasVideo) {
      $vmBadge.textContent = 'Video';
      $vmBadge.classList.remove('no-video');
    } else {
      $vmBadge.textContent = 'Audio only';
      $vmBadge.classList.add('no-video');
      $fbTitle.textContent = ep.title;
      $fbSub.textContent = formatDate(ep.pubDate);
    }
  }

  // Mirror audio → video
  audio.addEventListener('play',  () => { if (!syncing && video.src) { syncing = true; video.play().catch(()=>{}); syncing = false; }});
  audio.addEventListener('pause', () => { if (!syncing && video.src) { syncing = true; video.pause(); syncing = false; }});
  audio.addEventListener('seeked', () => {
    if (syncing || !video.src || !isFinite(video.duration)) return;
    if (Math.abs(video.currentTime - audio.currentTime) > SEEK_EPSILON) {
      syncing = true;
      try { video.currentTime = Math.min(video.duration, audio.currentTime); } catch {}
      syncing = false;
    }
  });
  audio.addEventListener('ratechange', () => {
    if (video.src) video.playbackRate = audio.playbackRate;
  });
  // Periodic drift correction so the card transitions stay aligned with audio.
  audio.addEventListener('timeupdate', () => {
    if (syncing || !video.src || video.readyState < 2 || !isFinite(video.duration)) return;
    const drift = Math.abs(video.currentTime - audio.currentTime);
    if (drift > 1.0) {
      syncing = true;
      try { video.currentTime = Math.min(video.duration, audio.currentTime); } catch {}
      syncing = false;
    }
  });

  // Mirror video → audio (only when user interacts with the video element directly)
  video.addEventListener('play',  () => { if (!syncing && audio.src && audio.paused) { syncing = true; audio.play().catch(()=>{}); syncing = false; }});
  video.addEventListener('pause', () => { if (!syncing && audio.src && !audio.paused && !audio.ended) { syncing = true; audio.pause(); syncing = false; }});
  video.addEventListener('seeked', () => {
    if (syncing || !audio.src) return;
    if (Math.abs(audio.currentTime - video.currentTime) > SEEK_EPSILON) {
      syncing = true;
      try { audio.currentTime = video.currentTime; } catch {}
      syncing = false;
    }
  });

  // Mobile collapse toggle
  $vToggle.addEventListener('click', () => {
    $vPanel.classList.toggle('collapsed');
    $vToggle.setAttribute('aria-expanded', $vPanel.classList.contains('collapsed') ? 'false' : 'true');
  });
  // Collapse by default on small screens
  if (window.matchMedia('(max-width: 899px)').matches) {
    $vPanel.classList.add('collapsed');
    $vToggle.setAttribute('aria-expanded', 'false');
  }

  /* ─── Helpers ─── */
  const fmt = s => {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2,'0')}`;
  };
  const mbStr = bytes => {
    if (!bytes || bytes === 0) return null;
    return (bytes / 1048576).toFixed(1) + ' MB';
  };
  const formatDate = str => {
    try {
      const d = new Date(str);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch { return str; }
  };
  const getTag = title => {
    const t = title.toLowerCase();
    if (t.includes('abe board review') || t.includes('abe review')) return 'abe';
    if (t.includes('recent literature') || t.includes('lit spotlight') || t.includes('literature spotlight')) return 'lit';
    if (t.includes('morning brief') || t.includes('endo brief')) return 'brief';
    return null;
  };
  const tagMeta = {
    abe:   { label: 'ABE Review',   cls: 'tag-abe' },
    lit:   { label: 'Lit Spotlight', cls: 'tag-lit' },
    brief: { label: 'Morning Brief', cls: 'tag-brief' },
  };

  /* ─── Fetch & parse RSS ─── */
  async function loadFeed() {
    const res  = await fetch(RSS_URL);
    const text = await res.text();
    const doc  = new DOMParser().parseFromString(text, 'application/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    episodes = items.map((item, idx) => {
      const enc     = item.querySelector('enclosure');
      const url     = enc?.getAttribute('url') || null;
      const length  = parseInt(enc?.getAttribute('length') || '0', 10);
      const durEl   = item.querySelector('duration');
      const duration = durEl?.textContent?.trim() || null;
      return {
        idx,
        title:    item.querySelector('title')?.textContent?.trim() || 'Untitled',
        desc:     item.querySelector('description')?.textContent?.trim() || '',
        pubDate:  item.querySelector('pubDate')?.textContent?.trim() || '',
        url,
        length,
        duration,
        unavailable: (!url || length === 0),
        tag:  getTag(item.querySelector('title')?.textContent?.trim() || ''),
        guid: item.querySelector('guid')?.textContent?.trim() || url || `ep-${idx}`,
      };
    });
    renderList(episodes);
    renderProgress();
    $loading.style.display = 'none';
  }

  /* ─── Render ─── */
  let activeFilter = 'all';

  function renderList(list) {
    $list.innerHTML = '';
    const visible = list.filter(ep => {
      if (activeFilter === 'all')         return true;
      if (activeFilter === 'listened')    return ep.guid && listened.has(ep.guid);
      if (activeFilter === 'unlistened')  return !ep.guid || !listened.has(ep.guid);
      return ep.tag === activeFilter;
    }).filter(ep => {
      const q = $search.value.trim().toLowerCase();
      if (!q) return true;
      return ep.title.toLowerCase().includes(q) || ep.desc.toLowerCase().includes(q);
    });

    $count.textContent = `${visible.length} episode${visible.length !== 1 ? 's' : ''}`;

    if (!visible.length) { $empty.style.display = ''; return; }
    $empty.style.display = 'none';

    visible.forEach(ep => {
      const card = document.createElement('div');
      const isListened = ep.guid && listened.has(ep.guid);
      card.className = 'episode-card' + (ep.unavailable ? ' unavailable' : '') + (activeIdx === ep.idx ? ' active' : '') + (isListened ? ' listened' : '');
      card.dataset.idx = ep.idx;

      const tag   = ep.tag ? `<span class="tag ${tagMeta[ep.tag].cls}">${tagMeta[ep.tag].label}</span>` : '';
      const unav  = ep.unavailable ? `<span class="tag tag-na">Unavailable</span>` : '';
      const sizeStr = ep.unavailable ? '' : (mbStr(ep.length) ? `<span class="ep-size">${mbStr(ep.length)}</span>` : '');
      const durStr  = ep.duration && !ep.unavailable ? `<span class="ep-dur">${ep.duration}</span>` : '';
      const nowPlaying = activeIdx === ep.idx
        ? `<span class="ep-nowplaying"><span class="pulse"></span>Now Playing</span>`
        : '';

      const playIcon = `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
      const pauseIcon = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
      const isPlaying = activeIdx === ep.idx && !audio.paused;

      const badgeCls = isListened ? 'listen-badge' : 'listen-badge unlistened';
      const badgeTip = isListened ? 'Click to unmark' : 'Mark as listened';
      card.innerHTML = `
        <div class="play-btn">${isPlaying ? pauseIcon : playIcon}</div>
        <div class="ep-body">
          <div class="ep-top">
            <div class="ep-title">${escHtml(ep.title)}</div>
            ${unav}${tag}
          </div>
          <div class="ep-meta">
            <span class="ep-date">${formatDate(ep.pubDate)}</span>
            ${sizeStr}${durStr}${nowPlaying}
          </div>
        </div>
        <button class="${badgeCls}" data-guid="${escHtml(ep.guid||'')}" title="${badgeTip}" aria-label="${badgeTip}">${isListened ? '✓' : '○'}</button>`;

      if (!ep.unavailable) {
        card.addEventListener('click', e => {
          if (e.target.closest('.listen-badge')) return; // handled below
          handleCardClick(ep.idx);
        });
      }
      const badge = card.querySelector('.listen-badge');
      if (badge) {
        badge.addEventListener('click', e => {
          e.stopPropagation();
          const guid = badge.dataset.guid;
          if (listened.has(guid)) unmarkListened(guid);
          else markListened(guid);
        });
      }
      $list.appendChild(card);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ─── Playback ─── */
  function handleCardClick(idx) {
    if (activeIdx === idx) {
      togglePlay();
    } else {
      playEpisode(idx);
    }
  }

  function playEpisode(idx) {
    const ep = episodes[idx];
    if (!ep || ep.unavailable) return;
    // Stop previous listen timer
    if (listenTimer) { clearInterval(listenTimer); listenTimer = null; }
    activeIdx = idx;
    activeGuid = ep.guid || null;
    partialSecs = partial[activeGuid] || 0;
    audio.src = ep.url;
    audio.playbackRate = SPEEDS[speedIdx];
    // Load matching video (if any) before audio starts so it can catch up via sync.
    const vUrl = videoUrlFor(ep.guid);
    setVideoMeta(ep, !!vUrl);
    showVideo(vUrl);
    audio.play();
    $bar.classList.add('visible');
    $title.textContent = ep.title;
    updatePlayPauseUI();
    renderList(episodes);
    // 60-second accumulation timer
    listenTimer = setInterval(() => {
      if (audio.paused || !activeGuid) return;
      if (listened.has(activeGuid)) return;
      partialSecs++;
      partial[activeGuid] = partialSecs;
      if (partialSecs >= 60) {
        markListened(activeGuid);
        savePartial();
      }
    }, 1000);
    // Scroll card into view
    setTimeout(() => {
      const card = $list.querySelector(`[data-idx="${idx}"]`);
      card?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 80);
  }

  function togglePlay() {
    if (audio.paused) audio.play();
    else audio.pause();
  }

  function updatePlayPauseUI() {
    const playing = !audio.paused;
    $iconP.style.display     = playing ? 'none' : '';
    $iconPause.style.display = playing ? '' : 'none';
    // Update card icon too
    const card = $list.querySelector(`[data-idx="${activeIdx}"]`);
    if (card) {
      const btn = card.querySelector('.play-btn');
      if (btn) btn.innerHTML = playing
        ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
    }
  }

  /* ─── Audio events ─── */
  audio.addEventListener('play',  updatePlayPauseUI);
  audio.addEventListener('pause', updatePlayPauseUI);
  audio.addEventListener('ended', () => {
    updatePlayPauseUI();
    // Auto-advance to next episode
    const nextIdx = activeIdx + 1;
    if (nextIdx < episodes.length && !episodes[nextIdx].unavailable) {
      playEpisode(nextIdx);
    }
  });
  audio.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    $seekBar.value = pct;
    $seekBar.style.background = `linear-gradient(to right, var(--gold) ${pct}%, var(--border) ${pct}%)`;
    $timeCur.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('durationchange', () => {
    $timeTot.textContent = fmt(audio.duration);
  });

  /* ─── Player controls ─── */
  $ppBtn.addEventListener('click', togglePlay);

  $skBack.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
  $skFwd.addEventListener('click',  () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); });

  $seekBar.addEventListener('mousedown', () => { isSeeking = true; });
  $seekBar.addEventListener('touchstart', () => { isSeeking = true; });
  $seekBar.addEventListener('input', () => {
    const pct = $seekBar.value;
    $seekBar.style.background = `linear-gradient(to right, var(--gold) ${pct}%, var(--border) ${pct}%)`;
    $timeCur.textContent = fmt((pct / 100) * (audio.duration || 0));
  });
  $seekBar.addEventListener('change', () => {
    if (audio.duration) audio.currentTime = ($seekBar.value / 100) * audio.duration;
    isSeeking = false;
  });

  $speedBtn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    const s = SPEEDS[speedIdx];
    audio.playbackRate = s;
    $speedBtn.textContent = s === 1 ? '1×' : `${s}×`;
  });

  /* ─── Search & filter ─── */
  $search.addEventListener('input', () => renderList(episodes));
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderList(episodes);
    });
  });

  /* ─── Keyboard shortcuts ─── */
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowLeft')  audio.currentTime = Math.max(0, audio.currentTime - 15);
    if (e.code === 'ArrowRight') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30);
  });

  /* ─── Reset button ─── */
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('Reset all listen progress?')) return;
    listened.clear();
    Object.keys(partial).forEach(k => delete partial[k]);
    saveListened();
    savePartial();
    renderProgress();
    renderList(episodes);
  });

  /* ─── Boot ─── */
  loadFeed().catch(err => {
    $loading.querySelector('.loading-text').textContent = 'Failed to load feed. Check your connection.';
    console.error(err);
  });
})();

  /* ── Fullscreen ── */
  const $fsBtn = document.getElementById('fs-btn');
  const $vWrap = $fsBtn.closest('.video-wrap');

  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      $vWrap.requestFullscreen().catch(err => console.warn('FS error:', err));
    }
  }

  $fsBtn.addEventListener('click', toggleFullscreen);

  video.addEventListener('dblclick', toggleFullscreen);

  document.addEventListener('fullscreenchange', () => {
    $fsBtn.textContent = document.fullscreenElement ? '✕' : '⛶';
  });

</script>
</body>
</html>
